name = "marriage-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://marriage-client.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "marriage-registry"
database_id = "95564952-6660-43a4-b25a-9c7d2e35f4e6"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "marriage-assets"

[[kv_namespaces]]
binding = "PINCODE_CACHE"
id = "3a84a831372541f7a7b9ab5d565f6187"

# Secrets — set via: wrangler secret put SECRET_NAME
# JWT_SECRET

[dev]
port = 8787
local_protocol = "http"
